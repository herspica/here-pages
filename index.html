<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Still Here — welcome home." />
    <link rel="icon" type="image/svg+xml" href="/here-pages/favicon.svg" />
    <script>
      (() => {
        let theme = 'white';
        try {
          const saved = localStorage.getItem('still-here:theme:v1');
          if (saved === 'universe' || saved === 'event-horizon' || saved === 'lunar-folio') theme = saved;
        } catch {}
        const preview = new URLSearchParams(location.search).get('theme');
        if (preview === 'white' || preview === 'universe' || preview === 'event-horizon' || preview === 'lunar-folio') theme = preview;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme === 'white' ? 'light' : 'dark';
        document.querySelector('meta[name="theme-color"]').content = theme === 'white' ? '#ffffff' : theme === 'event-horizon' ? '#020305' : theme === 'lunar-folio' ? '#030332' : '#030303';
      })();
    </script>
    <title>still here</title>
    <script type="module" crossorigin src="/here-pages/assets/index-Yd8GIHeH.js"></script>
    <link rel="stylesheet" crossorigin href="/here-pages/assets/index-CSSppci5.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
